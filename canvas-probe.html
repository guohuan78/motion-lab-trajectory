<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;width:100%;height:100%;background:#111}canvas{width:100%;height:100%;display:block}#s{position:fixed;z-index:99;left:20px;top:20px;color:white;background:#000c;padding:12px;font:24px sans-serif}</style>
<canvas id="c"></canvas><div id="s">BOOT</div>
<script>
(function(){
  var c=document.getElementById('c'),s=document.getElementById('s');
  var d=Math.min(window.devicePixelRatio||1,2),w=window.innerWidth,h=window.innerHeight;
  c.width=w*d;c.height=h*d;
  var x=c.getContext('2d',{alpha:false,desynchronized:true});
  s.textContent='CTX '+(x?'OK':'NULL')+' '+w+'x'+h+' dpr='+d;
  if(!x)return;
  x.setTransform(d,0,0,d,0,0);x.fillStyle='#16324f';x.fillRect(0,0,w,h);
  var n=0;function f(){n++;x.fillStyle='#16324f';x.fillRect(0,80,w,h-80);x.fillStyle='#b6ff2e';x.beginPath();x.arc(30+(n%180)/180*(w-60),h/2,24,0,Math.PI*2);x.fill();s.textContent='RAF '+n+' '+w+'x'+h;requestAnimationFrame(f)}f();
})();
</script>
