<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#050308" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050308;
  overscroll-behavior: none;
}

#stage {
  position: fixed;
  left: 0;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

    </style>
    <title>165Hz 轨迹对比</title>
  </head>
  <body>
    <canvas id="stage" aria-label="轨迹场景：分屏对比不同刷新率下的拖尾密度，单屏模式可切换帧率、拖动光点"></canvas>
    <noscript>此演示需要启用 JavaScript。</noscript>
    <script>
      // ES5 内联报错浮层：在 app.js 之前装载，即使 app.js 解析失败也能显示错误
      (function () {
        window.__motionLabBoot = { scriptLoaded: false, firstFrame: false };
        function show(msg) {
          var el = document.getElementById("motionlab-error");
          if (!el) {
            el = document.createElement("div");
            el.id = "motionlab-error";
            el.setAttribute("style", "position:fixed;left:8px;top:8px;right:8px;z-index:9999;color:#ff8a8a;background:rgba(0,0,0,0.85);font:12px/1.5 monospace;padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-all;");
            document.body.appendChild(el);
          }
          el.textContent += msg + "\n";
        }
        window.__motionLabShowError = show;
        window.addEventListener("error", function (e) {
          show((e && e.message ? e.message : "error") + " @" + (e && e.lineno ? e.lineno : 0));
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("reject: " + String(e && e.reason ? e.reason : "?"));
        });
        window.setTimeout(function () {
          var boot = window.__motionLabBoot;
          if (document.hidden || (boot && boot.firstFrame)) return;
          show(
            "初始化未完成：script=" + (boot && boot.scriptLoaded ? "ok" : "missing")
            + ", viewport=" + (window.innerWidth || 0) + "x" + (window.innerHeight || 0)
            + ", ua=" + navigator.userAgent
          );
        }, 3000);
      })();
    </script>
    <script>
(() => {
  "use strict";

  // 由 index.html 的 ES5 启动监控读取；只有完整绘制完首帧才标记 ready。
  if (window.__motionLabBoot) window.__motionLabBoot.scriptLoaded = true;

  // 轨迹场景网页版：移植自 android-sync-demo/singlecompare165 的
  // SingleCompareView.java（drawFigureEightScene / renderInteractiveTrace /
  // sampledSeconds / 速度滑杆 / 玻璃控件），仅保留「轨迹」场景。
  // 注：为兼容较老的手机浏览器内核（如 X5/Chromium 57），本文件避免
  // 使用 ?.、??、函数调用尾逗号等 ES2017+ 语法；报错浮层见 index.html。

  const MODE_SPLIT = 0;
  const MODE_SINGLE = 1;
  const SPLIT_SAMPLE_RATES = [120, 90, 60];
  const DEMO_REFRESH_RATES = [165, 120, 90, 60];
  const DEFAULT_SPLIT_FPS = 120;
  const FALLBACK_HZ = 165;

  const MIN_SPEED = 0.25;
  const MAX_SPEED = 2.0;
  const DEFAULT_SPEED = 0.65;

  const TRACE_TRAIL_MS = 300; // TRACE_TRAIL_NS = 300000000L
  const TRACE_X_SPEED = 6.3; // TRACE_X_SPEED
  const TRACE_Y_SPEED = 12.6; // TRACE_Y_SPEED
  const TRACE_TRAIL_CAP = 64;
  const RETURN_MS = 300; // 松手后弹回轨道时长（3.0E8 ns）
  const GUIDE_SEGMENTS = 96;

  const rgb = (r, g, b) => [r, g, b];
  const BG_TOP = rgb(5, 3, 8);
  const BG_BOTTOM = rgb(7, 11, 20);
  const INK = rgb(255, 255, 255);
  const INK_SOFT = rgb(255, 255, 255); // alpha 204 at use site
  const MUTED = rgb(167, 176, 192);
  const FAINT = rgb(110, 119, 138);
  const BRAND = rgb(182, 255, 46);
  const ORANGE_A = rgb(255, 200, 155);
  const ORANGE_B = rgb(255, 122, 89);
  const BLUE_A = rgb(158, 182, 255);
  const BLUE_B = rgb(64, 110, 246);
  const NEON_PINK = rgb(255, 107, 174);
  const NEON_PURPLE = rgb(160, 107, 255);
  const SELECT_STROKE = [NEON_PINK, NEON_PURPLE];
  const PEACH_STROKE = [ORANGE_A, ORANGE_B];
  const BLUE_STROKE = [BLUE_A, BLUE_B];
  const CONTROL_ACTIVE_MODE = rgb(102, 92, 246);
  const CONTROL_ACTIVE_RATE = rgb(246, 143, 84);
  const MODE_LABELS = ["分屏对比", "单屏显示"];

  const css = (c, a = 255) => `rgba(${c[0]},${c[1]},${c[2]},${(Math.max(0, Math.min(255, a)) / 255).toFixed(3)})`;

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });

  const state = {
    width: 1,
    height: 1,
    dpr: 1,
    unit: 1,
    portrait: true,
    mode: MODE_SINGLE,
    splitFps: DEFAULT_SPLIT_FPS,
    singleFps: null, // null = 自动（实测可达的最高档）
    speed: DEFAULT_SPEED,
    anchorMs: performance.now(),
    anchorSeconds: 0,
    // 实测刷新率
    measuredHz: 0,
    frameMs: 0,
    frameIntervals: [],
    lastFrameTs: 0,
    lastMetricUpdate: 0,
    // 单屏模式拖尾环形缓冲
    trail: [],
    lastSimFrame: -1,
    dragging: false,
    armed: false,
    dragStartX: 0,
    dragStartY: 0,
    pointerX: 0,
    pointerY: 0,
    returning: false,
    returnStartMs: 0,
    returnFromX: 0,
    returnFromY: 0,
    sliderDragging: false,
    rects: { chips: [], modes: [], slider: null, content: null, panels: [] },
    bg: null,
  };

  const gradientCache = new Map();
  const guideCache = new Map();

  // ---------- 基础绘制 ----------

  function roundRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function hGradient(x0, x1, colors, alpha) {
    // Array.prototype.flat() 直到 Chromium 69 才提供；微信 X5 的 Chromium 57
    // 会在首帧选中态绘制时直接抛错，页面因此只剩预渲染的黑色背景。
    const colorKey = colors.map((color) => color.join(".")).join("_");
    const key = `h${Math.round(x0)},${Math.round(x1)},${colorKey},${alpha}`;
    let g = gradientCache.get(key);
    if (!g) {
      g = ctx.createLinearGradient(x0, 0, x1, 0);
      const n = colors.length;
      colors.forEach((c, i) => g.addColorStop(n === 1 ? 0 : i / (n - 1), css(c, alpha)));
      gradientCache.set(key, g);
    }
    return g;
  }

  function rimGradient(x0, x1, midColor) {
    const key = `rim${Math.round(x0)},${Math.round(x1)},${midColor.flat ? midColor.join(".") : midColor}`;
    let g = gradientCache.get(key);
    if (!g) {
      g = ctx.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(0.5, midColor);
      g.addColorStop(1, "rgba(0,0,0,0)");
      gradientCache.set(key, g);
    }
    return g;
  }

  function glassPanel(x, y, w, h, radius, tint, strokeColors, strokeAlpha, glow) {
    ctx.fillStyle = css(INK, 16); // GLASS
    roundRectPath(ctx, x, y, w, h, radius);
    ctx.fill();
    if (tint) {
      ctx.fillStyle = tint;
      roundRectPath(ctx, x, y, w, h, radius);
      ctx.fill();
    }
    const u = state.unit;
    if (strokeColors && glow) {
      for (let i = 1; i <= 2; i += 1) {
        const expand = i * u;
        ctx.strokeStyle = hGradient(x - expand, x + w + expand, strokeColors, i === 1 ? 24 : 10);
        ctx.lineWidth = 1.1 * u;
        roundRectPath(ctx, x - expand, y - expand, w + expand * 2, h + expand * 2, radius + expand);
        ctx.stroke();
      }
    }
    if (strokeColors) {
      ctx.strokeStyle = hGradient(x, x + w, strokeColors, strokeAlpha);
      ctx.lineWidth = 1.2 * u;
    } else {
      ctx.strokeStyle = css(INK, 26); // GLASS_LINE
      ctx.lineWidth = 0.9 * u;
    }
    roundRectPath(ctx, x, y, w, h, radius);
    ctx.stroke();
    const rimInset = radius * 0.8;
    ctx.strokeStyle = rimGradient(x, x + w, strokeColors ? css(strokeColors[0], 96) : css(INK, 30));
    ctx.lineWidth = Math.max(1, 0.5 * u);
    ctx.beginPath();
    ctx.moveTo(x + rimInset, y + 0.9 * u);
    ctx.lineTo(x + w - rimInset, y + 0.9 * u);
    ctx.stroke();
  }

  function selectedControl(x, y, w, h, radius, fillColor, strokeColors) {
    glassPanel(x, y, w, h, radius, css(fillColor, 74), strokeColors, 232, true);
    const u = state.unit;
    const markerW = Math.min(34 * u, Math.max(12 * u, w - 18 * u));
    const markerH = Math.max(2.2 * u, 2.5 * u);
    const markerBottom = y + h - 3 * u;
    const mx = x + (w - markerW) / 2;
    ctx.fillStyle = hGradient(mx, mx + markerW, strokeColors, 255);
    roundRectPath(ctx, mx, markerBottom - markerH, markerW, markerH, markerH / 2);
    ctx.fill();
  }

  const condensed = (px) => `700 ${px}px "Roboto Condensed", "Arial Narrow", "PingFang SC", "Microsoft YaHei", sans-serif`;
  const medium = (px) => `500 ${px}px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif`;
  const regular = (px) => `400 ${px}px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif`;
  const mono = (px) => `700 ${px}px ui-monospace, Consolas, "PingFang SC", "Microsoft YaHei", monospace`;

  function centeredText(text, cx, cy) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, cx, cy + 0.5 * state.unit);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  // ---------- 时间轴（对应 timelineLock / sampledSeconds） ----------

  function timelineSeconds(nowMs) {
    return state.anchorSeconds + ((Math.max(0, nowMs - state.anchorMs) / 1000) * state.speed);
  }

  function sampledSeconds(nowMs, fps) {
    const period = 1000 / Math.max(1, fps);
    const elapsed = Math.max(0, nowMs - state.anchorMs);
    return state.anchorSeconds + ((Math.floor(elapsed / period) * period) / 1000) * state.speed;
  }

  function setSpeed(newSpeed) {
    if (Math.abs(newSpeed - state.speed) < 1e-4) return;
    const now = performance.now();
    state.anchorSeconds += ((Math.max(0, now - state.anchorMs) / 1000) * state.speed);
    state.anchorMs = now;
    state.speed = newSpeed;
  }

  function resetTimeline() {
    state.anchorMs = performance.now();
    state.anchorSeconds = 0;
    state.trail = [];
    state.lastSimFrame = -1;
    state.dragging = false;
    state.armed = false;
    state.returning = false;
  }

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // 单屏生效帧率：选中档不可达时回落到实测最高的可用档（对应 highestSupportedRate）
  function effectiveSingleRate() {
    const measured = state.measuredHz || FALLBACK_HZ;
    if (state.singleFps && state.singleFps <= measured) return state.singleFps;
    const fallback = DEMO_REFRESH_RATES.find((r) => r <= measured);
    return fallback !== undefined ? fallback : 60;
  }

  // ---------- 实测刷新率 ----------

  function measureHz(ts) {
    if (state.lastFrameTs) {
      const delta = ts - state.lastFrameTs;
      if (delta > 2 && delta < 50) {
        state.frameIntervals.push(delta);
        if (state.frameIntervals.length > 240) state.frameIntervals.shift();
      }
    }
    state.lastFrameTs = ts;
    if (ts - state.lastMetricUpdate < 240 || state.frameIntervals.length < 24) return;
    state.lastMetricUpdate = ts;
    const sorted = [...state.frameIntervals].sort((a, b) => a - b);
    const trim = Math.floor(sorted.length * 0.12);
    const core = sorted.slice(trim, sorted.length - trim || sorted.length);
    const median = core[Math.floor(core.length / 2)];
    const rawHz = 1000 / median;
    const known = [60, 72, 90, 120, 144, 165, 185, 240];
    const nearest = known.reduce((best, r) => (Math.abs(r - rawHz) < Math.abs(best - rawHz) ? r : best));
    state.measuredHz = Math.abs(nearest - rawHz) <= 3.5 ? nearest : Math.round(rawHz * 10) / 10;
    state.frameMs = median;
  }

  const hzText = () => {
    if (!state.measuredHz) return "--";
    return state.measuredHz >= 100 ? state.measuredHz.toFixed(0) : state.measuredHz.toFixed(1);
  };

  // ---------- 背景（静态，离屏预渲染） ----------

  function prerenderBackground() {
    const { width: w, height: h, dpr } = state;
    const bg = document.createElement("canvas");
    bg.width = Math.round(w * dpr);
    bg.height = Math.round(h * dpr);
    const b = bg.getContext("2d");
    b.setTransform(dpr, 0, 0, dpr, 0, 0);

    const v = b.createLinearGradient(0, 0, 0, h);
    v.addColorStop(0, css(BG_TOP));
    v.addColorStop(1, css(BG_BOTTOM));
    b.fillStyle = v;
    b.fillRect(0, 0, w, h);

    const glows = [
      [0.1 * w, 0.16 * h, 0.82 * h, [194, 24, 91], 30],
      [0.3 * w, 0.02 * h, 0.55 * h, [123, 31, 162], 22],
      [0.97 * w, 0.3 * h, 0.82 * h, [26, 35, 126], 30],
      [0.86 * w, 0.62 * h, 0.55 * h, [21, 101, 192], 22],
      [0.1 * w, 1.02 * h, 0.55 * h, [191, 54, 12], 15],
    ];
    for (const [x, y, r, c, a] of glows) {
      const g = b.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, css(c, a));
      g.addColorStop(1, css(c, 0));
      b.fillStyle = g;
      b.fillRect(0, 0, w, h);
    }

    const horizonY = h * 0.84;
    const hg = b.createLinearGradient(w * 0.2, 0, w * 0.8, 0);
    hg.addColorStop(0, "rgba(0,0,0,0)");
    hg.addColorStop(0.5, css([140, 170, 210], 22));
    hg.addColorStop(1, "rgba(0,0,0,0)");
    b.fillStyle = hg;
    b.fillRect(w * 0.2, horizonY, w * 0.6, Math.max(1.4, 0.5 * state.unit));

    state.bg = bg;
  }

  function resize() {
    let rect = canvas.getBoundingClientRect();
    // 兜底：个别手机浏览器首帧布局未就绪时 rect 为 0，用视口尺寸顶上
    if (rect.width < 2 || rect.height < 2) {
      rect = {
        width: window.innerWidth || document.documentElement.clientWidth || 0,
        height: window.innerHeight || document.documentElement.clientHeight || 0,
      };
    }
    const physW = Math.max(1, rect.width);
    const physH = Math.max(1, rect.height);
    state.dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(physW * state.dpr);
    canvas.height = Math.round(physH * state.dpr);
    // 布局直接适配视口方向：竖屏视口用竖屏布局，横屏视口用横屏布局
    state.rotated = false;
    state.width = physW;
    state.height = physH;
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    state.portrait = state.height > state.width;
    state.unit = state.portrait
      ? Math.min(state.width / 393, state.height / 873)
      : Math.min(state.width / 873, state.height / 393);
    gradientCache.clear();
    guideCache.clear();
    prerenderBackground();
  }

  // ---------- 布局 ----------

  function chipRow(rates, left, top, right, bottom, out) {
    const gap = 6 * state.unit;
    const w = (right - left - gap * (rates.length - 1)) / rates.length;
    out.length = 0;
    rates.forEach((rate, i) => {
      out.push({ x: left + i * (w + gap), y: top, w, h: bottom - top, rate });
    });
  }

  function tabRow(left, top, right, bottom, out) {
    const gap = 6 * state.unit;
    const w = (right - left - gap) / 2;
    out.length = 0;
    MODE_LABELS.forEach((label, i) => {
      out.push({ x: left + i * (w + gap), y: top, w, h: bottom - top, mode: i, label });
    });
  }

  function layout() {
    const { width: w, height: h, unit: u, portrait } = state;
    const R = state.rects;
    const split = state.mode === MODE_SPLIT;

    if (portrait) {
      const L = 16 * u;
      const Rr = w - 16 * u;
      R.brand = { x: L, baseline: 32 * u };
      const rates = split ? SPLIT_SAMPLE_RATES : DEMO_REFRESH_RATES;
      R.chipsLabel = { x: L, baseline: 62 * u, text: split ? "左屏帧率" : "演示帧率" };
      chipRow(rates, L, 68 * u, Rr, 100 * u, R.chips);
      const cursor = 100 * u;
      const labelBase = cursor + 22 * u;
      const trackY = labelBase + 12 * u;
      R.slider = {
        x: L, y: trackY - 14 * u, w: Rr - L, h: 28 * u,
        trackL: L, trackR: Rr, trackY, labelX: L, labelBase, valueRight: Rr,
      };
      const tabTop = trackY + 16 * u;
      const tabBottom = tabTop + 36 * u;
      tabRow(L, tabTop, Rr, tabBottom, R.modes);
      R.content = { x: 12 * u, y: tabBottom + 12 * u, w: w - 24 * u, h: h - 12 * u - (tabBottom + 12 * u) };
    } else {
      const L = 18 * u;
      const Rr = 286 * u;
      R.brand = { x: L, baseline: 34 * u };
      const rates = split ? SPLIT_SAMPLE_RATES : DEMO_REFRESH_RATES;
      R.chipsLabel = { x: L, baseline: 66 * u, text: split ? "左屏帧率" : "演示帧率" };
      chipRow(rates, L, 72 * u, Rr, 104 * u, R.chips);
      const cursor = 104 * u;
      const labelBase = cursor + 22 * u;
      const trackY = labelBase + 12 * u;
      R.slider = {
        x: L, y: trackY - 14 * u, w: Rr - L, h: 28 * u,
        trackL: L, trackR: Rr, trackY, labelX: L, labelBase, valueRight: Rr,
      };
      const tabTop = trackY + 16 * u;
      const tabBottom = tabTop + 36 * u;
      tabRow(L, tabTop, Rr, tabBottom, R.modes);
      R.content = { x: 312 * u, y: 8 * u, w: w - 16 * u - 312 * u, h: h - 12 * u - 8 * u };
    }

    R.panels.length = 0;
    const gap = 8 * u;
    const c = R.content;
    if (split) {
      if (portrait) {
        const ph = (c.h - gap) / 2;
        R.panels.push({ x: c.x, y: c.y, w: c.w, h: ph, lower: true });
        R.panels.push({ x: c.x, y: c.y + ph + gap, w: c.w, h: ph, lower: false });
      } else {
        const pw = (c.w - gap) / 2;
        R.panels.push({ x: c.x, y: c.y, w: pw, h: c.h, lower: true });
        R.panels.push({ x: c.x + pw + gap, y: c.y, w: pw, h: c.h, lower: false });
      }
    } else {
      R.panels.push({ x: c.x, y: c.y, w: c.w, h: c.h, lower: false });
    }
  }

  // ---------- 控件绘制 ----------

  function drawControls() {
    const R = state.rects;
    const u = state.unit;

    ctx.font = condensed(19 * u);
    ctx.fillStyle = css(BRAND);
    ctx.fillText("165", R.brand.x, R.brand.baseline);
    const w165 = ctx.measureText("165").width;
    ctx.fillStyle = css(INK);
    ctx.fillText("轨迹", R.brand.x + w165, R.brand.baseline);

    if (R.chipsLabel) {
      ctx.font = medium(9 * u);
      ctx.fillStyle = css(MUTED);
      ctx.fillText(R.chipsLabel.text, R.chipsLabel.x, R.chipsLabel.baseline);
      const measured = state.measuredHz || FALLBACK_HZ;
      const singleRate = state.mode === MODE_SINGLE ? effectiveSingleRate() : 0;
      for (const chip of R.chips) {
        // 单屏：高于实测的档位不可选（对应 supportsRefreshRate 灰显）
        const supported = state.mode === MODE_SPLIT || chip.rate <= measured;
        const active = supported
          && (state.mode === MODE_SPLIT ? state.splitFps === chip.rate : singleRate === chip.rate);
        const r = chip.h / 2;
        if (active) {
          selectedControl(chip.x, chip.y, chip.w, chip.h, r, CONTROL_ACTIVE_RATE, PEACH_STROKE);
          ctx.font = medium(10.2 * u);
          ctx.fillStyle = css(INK);
        } else {
          glassPanel(chip.x, chip.y, chip.w, chip.h, r, null, null, 0, false);
          ctx.font = regular(9.5 * u);
          ctx.fillStyle = supported ? css(INK_SOFT, 204) : css(FAINT);
        }
        centeredText(String(chip.rate), chip.x + chip.w / 2, chip.y + chip.h / 2);
      }
    }

    drawSpeedSlider();

    for (const tab of R.modes) {
      const active = state.mode === tab.mode;
      const r = tab.h / 2;
      if (active) {
        selectedControl(tab.x, tab.y, tab.w, tab.h, r, CONTROL_ACTIVE_MODE, SELECT_STROKE);
        ctx.font = medium(12.5 * u);
        ctx.fillStyle = css(INK);
      } else {
        glassPanel(tab.x, tab.y, tab.w, tab.h, r, null, null, 0, false);
        ctx.font = regular(11.5 * u);
        ctx.fillStyle = css(INK_SOFT, 204);
      }
      centeredText(tab.label, tab.x + tab.w / 2, tab.y + tab.h / 2);
    }
  }

  function drawSpeedSlider() {
    const s = state.rects.slider;
    const u = state.unit;

    ctx.font = medium(9 * u);
    ctx.fillStyle = css(MUTED);
    ctx.fillText("运动速率", s.labelX, s.labelBase);
    const value = `${(state.speed / DEFAULT_SPEED).toFixed(2)}×`;
    ctx.font = mono(9.5 * u);
    ctx.fillStyle = css(BRAND);
    ctx.fillText(value, s.valueRight - ctx.measureText(value).width, s.labelBase);

    const progress = clamp(Math.log(state.speed / MIN_SPEED) / Math.log(MAX_SPEED / MIN_SPEED), 0, 1);
    const thumbX = s.trackL + (s.trackR - s.trackL) * progress;

    ctx.fillStyle = css(INK, 10);
    roundRectPath(ctx, s.trackL, s.trackY - 1.7 * u, s.trackR - s.trackL, 3.4 * u, 1.7 * u);
    ctx.fill();
    ctx.strokeStyle = css(INK, 18);
    ctx.lineWidth = Math.max(1, 0.4 * u);
    roundRectPath(ctx, s.trackL, s.trackY - 1.7 * u, s.trackR - s.trackL, 3.4 * u, 1.7 * u);
    ctx.stroke();

    ctx.strokeStyle = hGradient(s.trackL, s.trackR, [BLUE_A, BLUE_B], 255);
    ctx.lineWidth = 2.2 * u;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(s.trackL, s.trackY);
    ctx.lineTo(thumbX, s.trackY);
    ctx.stroke();
    ctx.lineCap = "butt";

    ctx.fillStyle = css(BLUE_A, 26);
    ctx.beginPath();
    ctx.arc(thumbX, s.trackY, 7.5 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = css(BLUE_A, 50);
    ctx.beginPath();
    ctx.arc(thumbX, s.trackY, 5 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = css(INK, 70);
    ctx.beginPath();
    ctx.arc(thumbX, s.trackY, 4 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = css(INK);
    ctx.beginPath();
    ctx.arc(thumbX, s.trackY, 2 * u, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- 面板与轨迹场景（drawPanel / drawFigureEightScene） ----------

  function drawPanel(rect, seconds, pointFps, lowerRate, title, interactive, simFps = 0) {
    const u = state.unit;
    const accentA = lowerRate ? ORANGE_A : BLUE_A;
    const accentB = lowerRate ? ORANGE_B : BLUE_B;

    glassPanel(rect.x, rect.y, rect.w, rect.h, 10 * u, css(accentB, 10), lowerRate ? PEACH_STROKE : BLUE_STROKE, 120, true);

    ctx.font = condensed(13 * u);
    const titleX = rect.x + 14 * u;
    const titleW = ctx.measureText(title).width;
    ctx.fillStyle = hGradient(titleX, titleX + titleW, [accentA, accentB], 255);
    ctx.fillText(title, titleX, rect.y + 24 * u);

    ctx.strokeStyle = css(accentA, 40);
    ctx.lineWidth = Math.max(1, 0.4 * u);
    ctx.beginPath();
    ctx.moveTo(rect.x + 14 * u, rect.y + 36 * u);
    ctx.lineTo(rect.x + rect.w - 14 * u, rect.y + 36 * u);
    ctx.stroke();

    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x + u, rect.y + 40 * u, rect.w - 2 * u, rect.h - 45 * u);
    ctx.clip();
    drawFigureEight(
      rect.x + 5 * u, rect.y + 40 * u, rect.w - 10 * u, rect.h - 45 * u,
      seconds, pointFps, interactive, accentA, accentB, simFps
    );
    ctx.restore();
  }

  function guidePath(cx, cy, rx, ry) {
    const key = `${Math.round(cx * 4)},${Math.round(cy * 4)},${Math.round(rx * 4)},${Math.round(ry * 4)}`;
    let p = guideCache.get(key);
    if (!p) {
      p = new Path2D();
      for (let i = 0; i <= GUIDE_SEGMENTS; i += 1) {
        const theta = (i / GUIDE_SEGMENTS) * Math.PI * 2;
        const x = cx + Math.sin(theta) * rx;
        const y = cy + Math.sin(theta * 2) * ry * 0.72;
        if (i === 0) p.moveTo(x, y);
        else p.lineTo(x, y);
      }
      guideCache.set(key, p);
    }
    return p;
  }

  function drawHead(x, y, accentA) {
    const u = state.unit;
    ctx.fillStyle = css(accentA, 32);
    ctx.beginPath();
    ctx.arc(x, y, 13 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = css(accentA, 58);
    ctx.beginPath();
    ctx.arc(x, y, 8.5 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = css(accentA);
    ctx.beginPath();
    ctx.arc(x, y, 5.6 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = css(INK);
    ctx.beginPath();
    ctx.arc(x, y, 2.2 * u, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFigureEight(l, t, w, h, seconds, pointFps, interactive, accentA, accentB, simFps = 0) {
    const u = state.unit;
    const cx = l + w / 2;
    const cy = t + h * 0.48;
    const rx = w * 0.34;
    const ry = h * 0.32;
    const orbitX = (s) => cx + Math.sin(s * TRACE_X_SPEED) * rx;
    const orbitY = (s) => cy + Math.sin(s * TRACE_Y_SPEED) * ry * 0.72;

    ctx.strokeStyle = css(MUTED, 22);
    ctx.lineWidth = 0.8 * u;
    ctx.stroke(guidePath(cx, cy, rx, ry));

    if (interactive) {
      renderInteractiveTrace(seconds, cx, cy, orbitX, orbitY, accentA, accentB, simFps);
      return;
    }

    // 分屏面板：按面板帧率解析采样拖尾（与 Android 非交互分支一致）
    const samples = Math.max(2, Math.round((TRACE_TRAIL_MS / 1000) * pointFps));
    ctx.strokeStyle = css(accentB, 92);
    ctx.lineWidth = 2.4 * u;
    ctx.beginPath();
    for (let i = samples - 1; i >= 0; i -= 1) {
      const ts = seconds - (i * state.speed) / pointFps;
      const x = orbitX(ts);
      const y = orbitY(ts);
      if (i === samples - 1) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    for (let i = samples - 1; i >= 0; i -= 1) {
      const ts = seconds - (i * state.speed) / pointFps;
      const progress = (samples - i) / samples;
      ctx.fillStyle = css(accentB, 18 + Math.round(progress * 230));
      ctx.beginPath();
      ctx.arc(orbitX(ts), orbitY(ts), (2.2 + progress * 2.6) * u, 0, Math.PI * 2);
      ctx.fill();
    }

    drawHead(orbitX(seconds), orbitY(seconds), accentA);
  }

  function renderInteractiveTrace(seconds, cx, cy, orbitX, orbitY, accentA, accentB, simFps = 0) {
    const u = state.unit;
    const nowMs = performance.now();
    // 模拟帧率：节流与光点位置必须落在同一个锚点网格上。
    // 之前节流用绝对时间取整、位置用锚点量化，两套网格在 rAF 抖动下相互错位，
    // 会把同一位置重复推入（点成对扎堆）或跳过（缺口），看起来断断续续。
    let simPeriod = 0;
    let frameIndex = -1;
    let orbitSeconds = seconds;
    if (simFps > 0) {
      simPeriod = 1000 / simFps;
      frameIndex = Math.floor(Math.max(0, nowMs - state.anchorMs) / simPeriod);
      orbitSeconds = state.anchorSeconds + ((frameIndex * simPeriod) / 1000) * state.speed;
    }
    let headX;
    let headY;
    if (state.dragging) {
      headX = state.pointerX;
      headY = state.pointerY;
    } else {
      const ox = orbitX(orbitSeconds);
      const oy = orbitY(orbitSeconds);
      if (state.returning) {
        const tR = (nowMs - state.returnStartMs) / RETURN_MS;
        if (tR >= 1) {
          state.returning = false;
          headX = ox;
          headY = oy;
        } else {
          const ease = 1 - Math.pow(1 - tR, 3);
          headX = state.returnFromX + (ox - state.returnFromX) * ease;
          headY = state.returnFromY + (oy - state.returnFromY) * ease;
        }
      } else {
        headX = ox;
        headY = oy;
      }
    }

    // 模拟帧率下按时间轴锚点的帧边界节流采样：光点位置只在模拟帧到来时
    // 更新，拖尾密度随之降低，观感等同物理屏幕降频（实机档每帧都推入）。
    if (simPeriod > 0) {
      if (frameIndex !== state.lastSimFrame || state.trail.length === 0) {
        state.lastSimFrame = frameIndex;
        state.trail.push({ x: headX, y: headY, t: nowMs });
        if (state.trail.length > TRACE_TRAIL_CAP) state.trail.shift();
      }
      const last = state.trail[state.trail.length - 1];
      headX = last.x;
      headY = last.y;
    } else {
      state.trail.push({ x: headX, y: headY, t: nowMs });
      if (state.trail.length > TRACE_TRAIL_CAP) state.trail.shift();
    }

    const cutoff = nowMs - TRACE_TRAIL_MS;
    ctx.strokeStyle = css(accentB, 92);
    ctx.lineWidth = 2.4 * u;
    ctx.beginPath();
    let started = false;
    for (const p of state.trail) {
      if (p.t < cutoff) continue;
      if (!started) {
        ctx.moveTo(p.x, p.y);
        started = true;
      } else {
        ctx.lineTo(p.x, p.y);
      }
    }
    ctx.stroke();

    const count = state.trail.length;
    for (let i = 0; i < count; i += 1) {
      const p = state.trail[i];
      if (p.t < cutoff) continue;
      const progress = (i + 1) / count;
      ctx.fillStyle = css(accentB, 18 + Math.round(progress * 230));
      ctx.beginPath();
      ctx.arc(p.x, p.y, (2.2 + progress * 2.6) * u, 0, Math.PI * 2);
      ctx.fill();
    }

    drawHead(headX, headY, accentA);
  }

  // ---------- 主循环 ----------

  function frame(ts) {
    measureHz(ts);
    layout();
    ctx.drawImage(state.bg, 0, 0, state.width, state.height);
    drawControls();

    if (state.mode === MODE_SPLIT) {
      const hz = state.measuredHz || FALLBACK_HZ;
      const [lower, higher] = state.rects.panels;
      drawPanel(lower, sampledSeconds(ts, state.splitFps), state.splitFps, true, `模拟${state.splitFps}Hz`, false);
      drawPanel(higher, sampledSeconds(ts, hz), hz, false, `实机${hzText()}Hz`, false);
    } else {
      // 选中档等于实测 = 实机渲染（连续时间轴 + 每帧拖尾）；
      // 低于实测 = 模拟渲染（时间量化 + 按该帧率节流采样，观感等同物理降频）
      const rate = effectiveSingleRate();
      const real = rate === (state.measuredHz || FALLBACK_HZ);
      const seconds = real ? timelineSeconds(ts) : sampledSeconds(ts, rate);
      drawPanel(
        state.rects.panels[0], seconds, real ? 0 : rate, !real,
        `${real ? "实机" : "模拟"}${rate}Hz`, true, real ? 0 : rate
      );
    }

    if (window.__motionLabBoot) window.__motionLabBoot.firstFrame = true;

    requestAnimationFrame(frame);
  }

  // ---------- 触控（handleContentDragTouch / onTouchEvent 的轨迹分支） ----------

  function toLocal(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  const hit = (r, p) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

  function updateSpeedFromTouch(x) {
    const s = state.rects.slider;
    const progress = clamp((x - s.trackL) / Math.max(state.unit, s.trackR - s.trackL), 0, 1);
    const raw = MIN_SPEED * Math.pow(MAX_SPEED / MIN_SPEED, progress);
    let snapped = Math.round(raw * 20) / 20;
    if (Math.abs(snapped - DEFAULT_SPEED) <= 0.03) snapped = DEFAULT_SPEED;
    setSpeed(clamp(snapped, MIN_SPEED, MAX_SPEED));
  }

  canvas.addEventListener("pointerdown", (e) => {
    const p = toLocal(e);
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    if (hit(state.rects.slider, p)) {
      state.sliderDragging = true;
      updateSpeedFromTouch(p.x);
      return;
    }
    if (state.mode === MODE_SINGLE && hit(state.rects.content, p)) {
      state.armed = true;
      state.dragStartX = p.x;
      state.dragStartY = p.y;
      state.pointerX = p.x;
      state.pointerY = p.y;
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    const p = toLocal(e);
    if (state.sliderDragging) {
      updateSpeedFromTouch(p.x);
      return;
    }
    if (state.armed && !state.dragging) {
      if (Math.hypot(p.x - state.dragStartX, p.y - state.dragStartY) > 2.5 * state.unit) {
        state.dragging = true;
        state.armed = false;
        state.returning = false; // 新拖动取消进行中的回弹
        state.pointerX = p.x;
        state.pointerY = p.y;
      }
      return;
    }
    if (state.dragging) {
      state.pointerX = p.x;
      state.pointerY = p.y;
    }
  });

  function endPointer(e) {
    const p = toLocal(e);
    if (state.sliderDragging) {
      state.sliderDragging = false;
      updateSpeedFromTouch(p.x);
      return;
    }
    if (state.dragging) {
      // 松手：光点缓动回到 8 字轨道
      state.dragging = false;
      state.returning = true;
      state.returnStartMs = performance.now();
      state.returnFromX = state.pointerX;
      state.returnFromY = state.pointerY;
      return;
    }
    state.armed = false;

    for (const tab of state.rects.modes) {
      if (hit(tab, p)) {
        if (state.mode !== tab.mode) {
          state.mode = tab.mode;
        }
        resetTimeline();
        return;
      }
    }
    if (state.mode === MODE_SPLIT) {
      for (const chip of state.rects.chips) {
        if (hit(chip, p)) {
          state.splitFps = chip.rate;
          resetTimeline();
          return;
        }
      }
    } else {
      const measured = state.measuredHz || FALLBACK_HZ;
      for (const chip of state.rects.chips) {
        if (hit(chip, p)) {
          if (chip.rate > measured) return; // 超出实测的档位不可选
          state.singleFps = chip.rate;
          resetTimeline();
          return;
        }
      }
    }
  }

  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  document.addEventListener("visibilitychange", () => {
    state.lastFrameTs = 0;
    state.frameIntervals = [];
  });

  addEventListener("resize", resize, { passive: true });
  addEventListener("orientationchange", () => setTimeout(resize, 120), { passive: true });
  addEventListener("load", resize);
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => resize()).observe(canvas);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) resize();
  });

  resize();
  requestAnimationFrame(frame);
})();

    </script>
  </body>
</html>
